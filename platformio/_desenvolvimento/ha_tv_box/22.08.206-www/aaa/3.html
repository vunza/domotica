<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        :root {
    --primary: #41bdf5;
    --primary-dark: #0288d1;
    --success: #39be5a;
    --danger: #f44336;
    --text: #333;
    --text-light: #666;
    --border: #ddd;
    --bg: #ffffff;
    --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
    --radius: 12px;
    --transition: all 0.2s ease;
}


/* Container centralizado */
.rename-container {
    width: 100%;
    max-width: 400px;
    background: var(--bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 30px;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    margin: auto;
}

/* Botão de fechar no canto superior direito */
.close-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: #f5f5f5;
    background: var(--danger);
    color: var(--text-light);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    font-size: 18px;
    font-weight: 400;
    z-index: 10;
}

.close-btn:hover {
    background: var(--danger);
    color: white;
    transform: rotate(90deg);
}

/* Efeito decorativo no topo */
.rename-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary) 0%, var(--success) 100%);
}

/* Cabeçalho */
.rename-header {
    text-align: center;
    margin-bottom: 25px;
    padding-right: 20px; /* Espaço para o botão de fechar */
}

.rename-icon {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
}

.rename-icon svg {
    width: 30px;
    height: 30px;
    stroke: white;
}

.rename-header h1 {
    font-size: 1.5rem;
    color: var(--text);
    margin-bottom: 5px;
    font-weight: 600;
}

.rename-header p {
    color: var(--text-light);
    font-size: 0.95rem;
}

/* Campo de nome */
.name-input-wrapper {
    margin-bottom: 25px;
}

.name-label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: var(--text-light);
    font-size: 0.9rem;
}

.name-input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    transition: var(--transition);
    background: #f9f9f9;
    color: var(--text);
}

.name-input:focus {
    outline: none;
    border-color: var(--primary);
    background: white;
    box-shadow: 0 0 0 3px rgba(65, 189, 245, 0.1);
}

.name-input:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

/* Contador de caracteres */
.char-counter {
    text-align: right;
    font-size: 0.85rem;
    color: var(--text-light);
    margin-top: 6px;
}

.char-counter.warning {
    color: orange;
}

.char-counter.danger {
    color: var(--danger);
}

/* Botões de ação */
.actions-row {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
}

@media (min-width: 480px) {
    .actions-row {
        flex-direction: row;
    }
}

.action-btn {
    flex: 1;
    padding: 14px 20px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 48px;
}

.action-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
}

.btn-edit {
    background: var(--primary);
    color: white;
}

.btn-edit:hover {
    background: var(--primary-dark);
}

.btn-save {
    background: var(--success);
    color: white;
}

.btn-save:hover {
    background: #2e8b57;
}

.btn-cancel {
    background: #f0f0f0;
    color: var(--text);
}

.btn-cancel:hover {
    background: #e0e0e0;
}

/* Estados dos botões */
.hidden {
    display: none;
}

/* Mensagem de feedback */
.message {
    padding: 12px 16px;
    border-radius: 8px;
    margin: 15px 0;
    font-weight: 500;
    text-align: center;
    animation: fadeIn 0.3s ease;
    font-size: 0.95rem;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.success {
    background: rgba(57, 190, 90, 0.1);
    color: var(--success);
    border: 1px solid rgba(57, 190, 90, 0.3);
}

.message.error {
    background: rgba(244, 67, 54, 0.1);
    color: var(--danger);
    border: 1px solid rgba(244, 67, 54, 0.3);
}

/* Responsividade */
@media (max-width: 480px) {
    body {
        padding: 15px;
    }
    
    .rename-container {
        padding: 25px 20px;
        max-width: 100%;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    .rename-header h1 {
        font-size: 1.3rem;
    }
    
    .rename-icon {
        width: 50px;
        height: 50px;
    }
    
    .rename-icon svg {
        width: 25px;
        height: 25px;
    }
    
    .name-input {
        padding: 12px 14px;
        font-size: 0.95rem;
    }
    
    .action-btn {
        padding: 12px 16px;
        font-size: 0.95rem;
    }
    
    .close-btn {
        top: 10px;
        right: 10px;
        width: 30px;
        height: 30px;
        font-size: 16px;
    }
}

@media (max-width: 320px) {
    .rename-container {
        padding: 20px 15px;
    }
    
    .rename-header h1 {
        font-size: 1.2rem;
    }
}


    </style>
</head>
<body>
    <div class="rename-container" id="rename-container" style="display: block">

        <!-- Guardar dados do dispositivo a ser renomeado -->
        <input type="text" id="save_device_name" name="save_device_name"  style="display: none;">
        <input type="text" id="save_device_id" name="save_device_id"  style="display: none;">

        <!-- Botão de fechar -->
        <button class="close-btn" id="closeBtn" title="Fechar">×</button>
        
        <div class="rename-header">
            <div class="rename-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                    <path d="M20 14.66V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5.34"></path>
                    <polygon points="18 2 22 6 12 16 8 16 8 12 18 2"></polygon>
                </svg>
            </div>
            <h1>Renomear Dispositivo</h1>
            <p>Atualize o Nome do Dispositivo</p>
        </div>
        
        <!-- Mensagem de feedback -->
        <div id="message" class="message hidden"></div>
        
        <!-- Campo para editar nome -->
        <div class="name-input-wrapper">
            <label class="name-label" for="deviceName">Nome do Dispositivo</label>
            <input 
                type="text" 
                id="deviceName" 
                class="name-input" 
                value="Digite o Novo Nome" 
                maxlength="30" 
                disabled
                placeholder="Digite o Novo Nome"
                autocomplete="off"
            >
            <div id="charCounter" class="char-counter">0/30 caracteres</div>
        </div>
        
        <!-- Botões de ação -->
        <div class="actions-row">
            <button id="editBtn" class="action-btn btn-edit">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                    <path d="M20 14.66V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5.34"></path>
                    <polygon points="18 2 22 6 12 16 8 16 8 12 18 2"></polygon>
                </svg>
                Editar Nome
            </button>
            
            <button id="saveBtn" class="action-btn btn-save hidden">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                    <polyline points="17 21 17 13 7 13 7 21"></polyline>
                    <polyline points="7 3 7 8 15 8"></polyline>
                </svg>
                Salvar
            </button>
            
            <button id="cancelBtn" class="action-btn btn-cancel hidden">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                Cancelar
            </button>
        </div>
    </div>

</body>
</html>
